services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_SCHEMA: ${DB_SCHEMA:-mua_hang}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8010:8010"
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_TARGET: http://backend:8010
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  uploads:
